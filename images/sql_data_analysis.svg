<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Playfair+Display:wght@700&amp;family=Fira+Code:wght@400;500;600&amp;display=swap');
      text { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
      .code { font-family: 'Fira Code', ui-monospace, Menlo, Monaco, Consolas, monospace; }
      .title-serif { font-family: 'Playfair Display', Georgia, serif; }
    </style>
    <linearGradient id="bg-sql" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a4933"/>
      <stop offset="100%" stop-color="#4a3a26"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg-sql)"/>

  <!-- Top Left Pill Badge -->
  <g transform="translate(48, 28)">
    <rect width="280" height="60" rx="30" fill="#ffffff"/>
    <!-- MySkill circle -->
    <g transform="translate(20, 10)">
      <circle cx="20" cy="20" r="18" fill="#00a389"/>
      <text x="20" y="24" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">MySkill</text>
      <!-- Tagline -->
      <text x="46" y="25" fill="#008a74" font-size="17" font-style="italic" font-weight="700">#RintisKarirImpian</text>
    </g>
  </g>

  <!-- Top Right Group B3 -->
  <g transform="translate(1180, 48)">
    <rect x="0" y="0" width="60" height="40" rx="20" fill="#ffffff"/>
    <text x="30" y="26" fill="#3b2d1d" font-size="18" font-weight="800" text-anchor="middle">B3</text>
  </g>

  <!-- MAIN TITLE & SUBTITLE -->
  <g transform="translate(68, 145)">
    <text x="0" y="0" fill="#ffffff" font-size="34" font-family="'Playfair Display', serif" font-weight="700" letter-spacing="1">Q5 REGISTRASI &amp; AVG WAKTU KE PEMBELIAN PERTAMA</text>
    
    <!-- Orange downward triangle and subtitle -->
    <g transform="translate(0, 22)">
      <polygon points="0,0 20,0 10,18" fill="#d97736"/>
      <text x="32" y="14" fill="#fed7aa" font-size="18" font-weight="500">jumlah pelanggan baru (distinct customer_id) yang registrasi per registration_channel</text>
    </g>
  </g>

  <!-- MAIN TWO-COLUMN CONTAINER -->
  <g transform="translate(68, 220)">
    
    <!-- LEFT CARD: Logical Thinking -->
    <g transform="translate(0, 0)">
      <text x="0" y="0" fill="#ffffff" font-size="18" font-weight="700">Logical Thinking :</text>
      
      <rect x="0" y="16" width="410" height="430" rx="28" fill="#463825" stroke="#b2743a" stroke-width="1.8"/>

      <g fill="#fed7aa" font-size="13" text-anchor="middle">
        <text x="205" y="52" fill="#ffffff" font-weight="600">customer_detail</text>
        <text x="205" y="76" fill="#d97736" font-size="16">↓</text>
        
        <text x="205" y="100">Filter registrations in 2024</text>
        <text x="205" y="124" fill="#d97736" font-size="16">↓</text>
        
        <text x="205" y="146" font-weight="600">COUNT(DISTINCT customer_id)</text>
        <text x="205" y="166" fill="#fb923c" font-size="12">→ New Customers</text>

        <text x="205" y="200" fill="#ffffff" font-weight="600">order_detail</text>
        <text x="205" y="222" fill="#d97736" font-size="16">↓</text>

        <text x="205" y="244">Filter is_valid = 1</text>
        <text x="205" y="266" fill="#d97736" font-size="16">↓</text>

        <text x="205" y="288" font-weight="600">MIN(order_date)</text>
        <text x="205" y="308" fill="#fb923c" font-size="12">→ First Valid Purchase</text>

        <text x="205" y="340" fill="#ffffff" font-weight="600">customer_detail</text>
        <text x="205" y="360" fill="#d97736" font-size="16">↓</text>

        <text x="205" y="380">INNER JOIN by customer_id</text>
        <text x="205" y="398" font-size="12">DATE_DIFF(first purchase, registration date)</text>
        <text x="205" y="420" fill="#fb923c" font-weight="600">GROUP BY Month + Channel</text>
      </g>
    </g>

    <!-- RIGHT CARD: Query SQL -->
    <g transform="translate(440, 0)">
      <text x="0" y="0" fill="#ffffff" font-size="18" font-weight="700">Query SQL :</text>
      
      <!-- Editor Window -->
      <rect x="0" y="16" width="700" height="430" rx="14" fill="#0c1117" stroke="#b2743a" stroke-width="1.8"/>

      <g class="code" font-size="12.5" fill="#f1f5f9" font-weight="500">
        <text x="24" y="48"><tspan fill="#38bdf8" font-weight="700">WITH</tspan> first_purchase <tspan fill="#38bdf8" font-weight="700">AS</tspan> (</text>
        
        <text x="48" y="72"><tspan fill="#38bdf8" font-weight="700">SELECT</tspan></text>
        <text x="72" y="92">customer_id,</text>
        <text x="72" y="112"><tspan fill="#60a5fa">MIN</tspan>(order_date) <tspan fill="#38bdf8">AS</tspan> first_order_date</text>
        <text x="48" y="132"><tspan fill="#38bdf8" font-weight="700">FROM</tspan> `&lt;project&gt;.&lt;dataset&gt;.order_detail`</text>
        <text x="48" y="152"><tspan fill="#38bdf8" font-weight="700">WHERE</tspan> is_valid = <tspan fill="#f59e0b">1</tspan></text>
        <text x="48" y="172"><tspan fill="#38bdf8" font-weight="700">GROUP BY</tspan> customer_id</text>
        <text x="24" y="192">)</text>

        <text x="24" y="218"><tspan fill="#38bdf8" font-weight="700">SELECT</tspan></text>
        <text x="48" y="238"><tspan fill="#60a5fa">EXTRACT</tspan>(<tspan fill="#ec4899">MONTH</tspan> <tspan fill="#38bdf8">FROM</tspan> c.registration_date) <tspan fill="#38bdf8">AS</tspan> bulan_angka,</text>
        <text x="48" y="258"><tspan fill="#60a5fa">FORMAT_DATE</tspan>(<tspan fill="#34d399">'%B'</tspan>, c.registration_date) <tspan fill="#38bdf8">AS</tspan> bulan_nama,</text>
        <text x="48" y="278">c.registration_channel,</text>
        <text x="48" y="298"><tspan fill="#60a5fa">COUNT</tspan>(<tspan fill="#38bdf8">DISTINCT</tspan> c.customer_id) <tspan fill="#38bdf8">AS</tspan> pelanggan_baru,</text>
        <text x="48" y="318"><tspan fill="#60a5fa">ROUND</tspan>(</text>
        <text x="68" y="338"><tspan fill="#60a5fa">AVG</tspan>(<tspan fill="#60a5fa">DATE_DIFF</tspan>(<tspan fill="#60a5fa">DATE</tspan>(fp.first_order_date), <tspan fill="#60a5fa">DATE</tspan>(c.registration_date), <tspan fill="#ec4899">DAY</tspan>)), <tspan fill="#f59e0b">2</tspan></text>
        <text x="48" y="358">) <tspan fill="#38bdf8">AS</tspan> avg_hari_ke_pembelian_pertama</text>
        
        <text x="24" y="380"><tspan fill="#38bdf8" font-weight="700">FROM</tspan> `&lt;project&gt;.&lt;dataset&gt;.customer_detail` <tspan fill="#38bdf8">AS</tspan> c</text>
        <text x="24" y="400"><tspan fill="#38bdf8" font-weight="700">INNER JOIN</tspan> first_purchase <tspan fill="#38bdf8">AS</tspan> fp <tspan fill="#38bdf8">ON</tspan> c.customer_id = fp.customer_id</text>
        <text x="24" y="420"><tspan fill="#38bdf8" font-weight="700">WHERE</tspan> c.registration_date &gt;= <tspan fill="#34d399">'2024-01-01'</tspan> <tspan fill="#38bdf8">AND</tspan> c.registration_date &lt; <tspan fill="#34d399">'2025-01-01'</tspan></text>
        <text x="24" y="438"><tspan fill="#38bdf8" font-weight="700">GROUP BY</tspan> <tspan fill="#f59e0b">1, 2, 3</tspan> <tspan fill="#38bdf8" font-weight="700">ORDER BY</tspan> bulan_angka, c.registration_channel;</text>
      </g>
    </g>
  </g>
</svg>
